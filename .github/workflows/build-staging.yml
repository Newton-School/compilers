name: Trigger Staging Build

on:
  workflow_dispatch:

concurrency:
  group: build-staging
  cancel-in-progress: true

env:
  IMAGE_NAME: newtonschool/judge0-newton-compiler

jobs:
  build:
    runs-on: monkci-ubuntu-24.04-4
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Resolve image tag
        id: tags
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NewtonDockerFiles/NewtonDockerfile-v2
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "Pushed \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
