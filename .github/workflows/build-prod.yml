name: Trigger Production Build

on:
  workflow_dispatch:

concurrency:
  group: build-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: newtonschool/judge0-newton-compiler

jobs:
  build:
    runs-on: monkci-ubuntu-24.04-4
    timeout-minutes: 150
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Reclaim stale Docker build cache
        run: |
          docker builder prune -af --filter "until=72h" || true
          docker image prune -af --filter "until=72h" || true

      - name: Resolve image tag
        id: tags
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NewtonDockerFiles/NewtonDockerfile-v2
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "Pushed \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
