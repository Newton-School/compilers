name: Build & push (production)

# Production pushes are MANUAL ONLY. Two safety gates (mirrors
# newton-marketing-web's deploy-prod.yml):
#   1. The 'production' GitHub Environment requires a human reviewer to
#      approve every run (configure in repo settings → Environments).
#   2. The user must type "build" in the workflow_dispatch input as a
#      typo-prevention step.
#
# Builds NewtonDockerFiles/NewtonDockerfile-v2 and pushes it to Docker Hub
# as newtonschool/judge0-newton-compiler — same repo as build-staging.yml;
# Docker Hub has no separate staging/prod registry, so this workflow only
# adds the review gate + typed confirmation for the "official" push.
#
# Expect this job to take 45–75 minutes (see repo CLAUDE.md) and to need
# ≥100GB of free disk on the runner. If monkci-ubuntu-24.04-4 turns out too
# small/slow for this specific build, bump to a bigger self-hosted tier.
#
# Required secrets: DOCKERHUB_USERNAME / DOCKERHUB_PASSWORD (org-level,
# same ones open-internal-edison-proxy already uses).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm a production image build & push'
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "master"

concurrency:
  group: build-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: newtonschool/judge0-newton-compiler

jobs:
  validate-confirmation:
    runs-on: monkci-ubuntu-24.04-4
    steps:
      - name: Check the typed confirmation matches "build"
        run: |
          if [ "${{ inputs.confirm }}" != "build" ]; then
            echo "::error::You must type exactly 'build' to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

  build:
    needs: validate-confirmation
    runs-on: monkci-ubuntu-24.04-4
    timeout-minutes: 150
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Self-hosted runner disk persists across runs, and this image alone
      # needs ~100GB free. Only clear cache/images older than a few days so
      # back-to-back builds still reuse layers.
      - name: Reclaim stale Docker build cache
        run: |
          docker builder prune -af --filter "until=72h" || true
          docker image prune -af --filter "until=72h" || true

      - name: Resolve image tag
        id: tags
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NewtonDockerFiles/NewtonDockerfile-v2
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "Pushed \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
